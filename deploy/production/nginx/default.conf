server {
    listen 80;
    server_name ekkoliu.com www.ekkoliu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name 110.42.223.141 _;

    include /etc/nginx/conf.d/app-locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ekkoliu.com www.ekkoliu.com;

    ssl_certificate /etc/letsencrypt/live/ekkoliu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekkoliu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/app-locations.inc;
}
