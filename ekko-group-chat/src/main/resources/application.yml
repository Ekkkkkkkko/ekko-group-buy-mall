server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: ekko-group-chat
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: GroupChat_HikariCP
      minimum-idle: ${CHAT_DB_MINIMUM_IDLE:5}
      idle-timeout: ${CHAT_DB_IDLE_TIMEOUT_MS:180000}
      maximum-pool-size: ${CHAT_DB_MAXIMUM_POOL_SIZE:10}
      auto-commit: true
      max-lifetime: ${CHAT_DB_MAX_LIFETIME_MS:600000}
      keepalive-time: ${CHAT_DB_KEEPALIVE_TIME_MS:300000}
      connection-timeout: ${CHAT_DB_CONNECTION_TIMEOUT_MS:30000}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: ${CHAT_MAX_FILE_SIZE:50MB}
      max-request-size: ${CHAT_MAX_REQUEST_SIZE:55MB}
  data:
    redis:
      host: ${CHAT_REDIS_HOST:127.0.0.1}
      port: ${CHAT_REDIS_PORT:6379}
      password: ${CHAT_REDIS_PASSWORD:}
      database: ${CHAT_REDIS_DATABASE:0}
      timeout: ${CHAT_REDIS_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

group-chat:
  web:
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:http://localhost:5173}
  oss:
    region: ${OSS_REGION:cn-shanghai}
    bucket: ${OSS_BUCKET}
    endpoint: ${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    original-prefix: ${OSS_ORIGINAL_PREFIX:knowledge/original}
    parsed-prefix: ${OSS_PARSED_PREFIX:knowledge/parsed}
  mineru:
    base-url: ${MINERU_BASE_URL:https://mineru.net}
    api-key: ${MINERU_API_KEY}
    language: ${MINERU_LANGUAGE:ch}
    formula-enabled: ${MINERU_FORMULA_ENABLED:true}
    table-enabled: ${MINERU_TABLE_ENABLED:true}
    ocr-enabled: ${MINERU_OCR_ENABLED:false}
  image:
    description-enabled: ${CHAT_IMAGE_DESCRIPTION_ENABLED:true}
    vision-model: ${CHAT_VISION_MODEL:qwen3-vl-plus}
    description-version: ${CHAT_IMAGE_DESCRIPTION_VERSION:image-v1}
    signed-url-expiration: ${CHAT_IMAGE_SIGNED_URL_EXPIRATION:15m}
    max-images-per-document: ${CHAT_MAX_IMAGES_PER_DOCUMENT:50}
    # 全库审计确认的 7 张 MinerU 红叉占位图。按内容过滤，兼容已入库分片；新导入时另有图形识别兜底。
    excluded-sha256: ${CHAT_IMAGE_EXCLUDED_SHA256:5ec9275e9ea879c9aecb84fb38106804d8fd4bbf19bbeb1c28c64693eb379be7,afae0387c75f4b3c87e53d9402c650b47fbee3c53b2e517e526a60458fd79fa5,dd5d2cf6acb65663f8de72b8eb7bc17612467cd84753fb4cb7c52ffeba05d33e,6e04effba1617ffc0c21b0b0f6b4530b5def0751e9521e9fb8e00687c1ec1cf7,603125f270c30ec4347471df938f8b55d9a3a06f228ff0d00882a658edb9ecf4,dd1eef36fff7b04f01a83eb64395fef38b80c72fde98cdf5fca0749a61136bd0,156624ca1829f995585dd288d1b26961a1ed31c743437efb23213c1f3f021565}
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    api-key: ${ELASTICSEARCH_API_KEY:}
    index-name: ${ELASTICSEARCH_INDEX_NAME:group_chat_knowledge_chunk_v2_1536}
  rag:
    model-base-url: ${MODEL_BASE_URL}
    api-key: ${MODEL_API_KEY}
    chat-model: ${CHAT_MODEL:qwen-plus}
    rag-chat-model: ${RAG_CHAT_MODEL:}
    common-chat-model: ${COMMON_CHAT_MODEL:}
    title-model: ${TITLE_MODEL:}
    enable-thinking: ${MODEL_ENABLE_THINKING:false}
    chat-temperature: ${CHAT_TEMPERATURE:0.1}
    rag-temperature: ${RAG_TEMPERATURE:0.1}
    common-temperature: ${COMMON_TEMPERATURE:0.3}
    title-temperature: ${TITLE_TEMPERATURE:0.5}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimension: ${EMBEDDING_DIMENSION:1536}
    embedding-version: ${EMBEDDING_VERSION:text-embedding-v4-1536-v1}
    embedding-batch-size: ${EMBEDDING_BATCH_SIZE:10}
    chunk-strategy: ${CHAT_CHUNK_STRATEGY:SMART}
    chunk-size: ${CHAT_CHUNK_SIZE:600}
    chunk-overlap: ${CHAT_CHUNK_OVERLAP:80}
    parent-chunk-size: ${CHAT_PARENT_CHUNK_SIZE:1800}
    title-level: ${CHAT_TITLE_LEVEL:3}
    small-chunk-merge-threshold: ${CHAT_SMALL_CHUNK_MERGE_THRESHOLD:120}
    min-meaningful-chars: ${CHAT_MIN_MEANINGFUL_CHARS:4}
    excel-html-mode: ${CHAT_EXCEL_HTML_MODE:false}
    preprocess-version: ${CHAT_PREPROCESS_VERSION:preprocess-v2}
    chunk-version: ${CHAT_CHUNK_VERSION:chunk-v2}
    product-model-filter-enabled: ${CHAT_PRODUCT_MODEL_FILTER_ENABLED:true}
    max-results: ${CHAT_MAX_RESULTS:5}
    min-score: ${CHAT_MIN_SCORE:0.65}
  redis:
    address: ${CHAT_REDISSON_ADDRESS:redis://127.0.0.1:6379}
    password: ${CHAT_REDIS_PASSWORD:}
    database: ${CHAT_REDIS_DATABASE:0}
    lock-wait-time: ${CHAT_REDIS_LOCK_WAIT_TIME:0s}
    lock-lease-time: ${CHAT_REDIS_LOCK_LEASE_TIME:10m}
    parent-cache-ttl: ${CHAT_REDIS_PARENT_CACHE_TTL:30s}
  pipeline:
    compensation-interval: ${CHAT_PIPELINE_COMPENSATION_INTERVAL:1m}
    stale-after: ${CHAT_PIPELINE_STALE_AFTER:5m}
    max-retries: ${CHAT_PIPELINE_MAX_RETRIES:5}
    compensation-batch-size: ${CHAT_PIPELINE_COMPENSATION_BATCH_SIZE:20}
  xxl-job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
    app-name: ${XXL_JOB_APP_NAME:ekko-group-chat-executor}
    address: ${XXL_JOB_EXECUTOR_ADDRESS:}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
  retrieval:
    query-rewrite-enabled: ${CHAT_QUERY_REWRITE_ENABLED:true}
    query-routing-enabled: ${CHAT_QUERY_ROUTING_ENABLED:true}
    vector-candidates: ${CHAT_VECTOR_CANDIDATES:20}
    full-text-candidates: ${CHAT_FULL_TEXT_CANDIDATES:20}
    full-text-min-score: ${CHAT_FULL_TEXT_MIN_SCORE:0.0}
    rrf-k: ${CHAT_RRF_K:60}
    final-max-results: ${CHAT_FINAL_MAX_RESULTS:5}
    sse-timeout: ${CHAT_SSE_TIMEOUT:5m}
    memory-max-messages: ${CHAT_MEMORY_MAX_MESSAGES:10}
    memory-ttl: ${CHAT_MEMORY_TTL:1h}
    rerank:
      enabled: ${CHAT_RERANK_ENABLED:false}
      model-path: ${CHAT_RERANK_MODEL_PATH:}
      tokenizer-path: ${CHAT_RERANK_TOKENIZER_PATH:}
      max-tokens: ${CHAT_RERANK_MAX_TOKENS:8192}
      min-score: ${CHAT_RERANK_MIN_SCORE:0.0}
